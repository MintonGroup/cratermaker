[package]
name = "cratermaker-py"
version = "2026.10.3-a20+g73987640"
edition = "2024"

[lib]
name = "bindings"
crate-type = ["cdylib"]

[dependencies]
cratermaker-components = { path = "../cratermaker-components" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29.0"
paste = "1.0.15"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[target.'cfg(not(target_env = "msvc"))'.dependencies.tikv-jemallocator]
version = "0.6"
features = ["disable_initial_exec_tls"]


[target.'cfg(unix)'.dependencies]
openssl-sys = "=0.9.111"
